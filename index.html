<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Van Gogh — Interactive Demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050708;color:#eadfbe;font-family:Georgia,'Times New Roman',serif}.scene{position:fixed;inset:0;overflow:hidden;transition:opacity 1s ease,visibility 1s ease}.hidden{opacity:0;visibility:hidden;pointer-events:none}.s1{display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#222019 0,#0d0f10 42%,#030405 100%)}.grain{position:absolute;inset:-20%;opacity:.16;pointer-events:none;background-image:radial-gradient(#fff 0.4px,transparent .6px);background-size:4px 4px;mix-blend-mode:soft-light;animation:grain 7s steps(8) infinite}@keyframes grain{50%{transform:translate3d(2%,1%,0)}}.stage{position:relative;width:min(72vw,620px);aspect-ratio:4/5;perspective:1200px;transform-style:preserve-3d;transition:transform .2s ease-out}.frame{position:absolute;inset:0;padding:7.5%;border:18px solid #7b4f20;border-radius:4px;background:linear-gradient(135deg,#a97b3f,#4f3218 22%,#d0a45f 48%,#4a2e14 71%,#9b6a2e);box-shadow:0 38px 90px #000, inset 0 0 0 7px #d0ac68,inset 0 0 0 11px #432912}.painting{position:relative;width:100%;height:100%;overflow:hidden;box-shadow:inset 0 0 40px #000}.painting img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.72) brightness(.76);transition:filter 1s ease}.s1.awake .painting img{filter:saturate(1.02) brightness(.95)}.tear{position:absolute;left:34%;top:15%;width:45%;height:30%;clip-path:polygon(7% 31%,22% 14%,51% 6%,82% 13%,98% 39%,88% 78%,63% 96%,26% 88%,4% 62%);overflow:hidden;filter:drop-shadow(0 0 18px #87b6ff66);opacity:.22;transition:opacity 1s}.tear img{width:100%;height:100%;object-fit:cover;transform:scale(1.8)}.s1.awake .tear{opacity:.85}.flap{position:absolute;left:34%;top:15%;width:45%;height:30%;transform-origin:52% 5%;clip-path:polygon(7% 31%,22% 14%,51% 6%,82% 13%,98% 39%,88% 78%,63% 96%,26% 88%,4% 62%);background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Self-Portrait%20%28Van%20Gogh%20September%201889%29.jpg?width=1200');background-size:225% 335%;background-position:49% 10%;box-shadow:0 10px 20px #0008;backface-visibility:visible;will-change:transform}.flap:after{content:'';position:absolute;inset:auto 0 0 0;height:10px;background:#d6c39e;box-shadow:0 2px 4px #0008}.rope{position:absolute;left:72%;top:30%;width:4px;height:0;background:linear-gradient(#dac59d,#7e6542);border-radius:999px;transform-origin:top;opacity:0;transition:opacity 1s,height 1s;filter:drop-shadow(0 4px 4px #000)}.rope:after{content:'';position:absolute;left:50%;bottom:-12px;width:28px;height:28px;border:4px solid #c8a36f;border-radius:50%;transform:translateX(-50%);background:#2a2015;box-shadow:0 4px 10px #0009}.s1.awake .rope{height:33%;opacity:1;cursor:grab}.s1.dragging .rope{cursor:grabbing}.plaque{position:absolute;left:50%;bottom:-76px;transform:translateX(-50%);width:68%;height:56px;border:1px solid #7e623a;background:linear-gradient(#4b3a24,#241a10);box-shadow:0 8px 25px #000;display:grid;place-items:center;letter-spacing:.18em;font-size:13px;color:#decba2;text-align:center}.dust{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,#b9a88755,transparent 32%),radial-gradient(circle at 70% 60%,#a18f7055,transparent 30%),linear-gradient(#9e8e7450,#6f624f66);mix-blend-mode:screen;transition:opacity .8s}.hint{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);font:11px/1.6 system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#d8caacaa;text-align:center;white-space:nowrap;transition:opacity .5s}.portalFlash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 57% 28%,#fff7c9,transparent 0);opacity:0}.s2{background:#041225}.sky{position:absolute;inset:-10%;background-image:linear-gradient(#05215c88,#02132baa),url('https://commons.wikimedia.org/wiki/Special:FilePath/Vincent%20van%20Gogh%20Starry%20Night.jpg?width=1920');background-size:cover;background-position:center;animation:skyDrift 16s ease-in-out infinite alternate;filter:saturate(1.15) contrast(1.08)}@keyframes skyDrift{to{transform:scale(1.08) translate3d(-1.5%,1%,0)}}.vortex{position:absolute;width:min(65vw,740px);aspect-ratio:1;left:61%;top:27%;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 20deg,#f6d570 0 7deg,#1c6fb3 13deg 28deg,#071b55 40deg 65deg,#93bfd6 77deg 98deg,#f4d27a 111deg 125deg,#0e4c8d 137deg 165deg,#061846 180deg 215deg,#c9d8ce 225deg 247deg,#e9c35b 258deg 276deg,#0d5796 289deg 318deg,#07184b 330deg 360deg);filter:blur(.5px) drop-shadow(0 0 45px #85a9ff77);mix-blend-mode:screen;opacity:.8;animation:spin 18s linear infinite}.vortex:before,.vortex:after{content:'';position:absolute;border-radius:50%;inset:13%;border:20px solid #f1d67755;filter:blur(7px)}.vortex:after{inset:34%;background:#fff6c5;box-shadow:0 0 55px #ffe894;filter:blur(4px)}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}.star{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe694;box-shadow:0 0 10px #fff3a8;animation:fly var(--d) linear infinite;opacity:.8}@keyframes fly{from{transform:translate(0,0) scale(.4)}to{transform:translate(var(--x),var(--y)) scale(1.8);opacity:0}}.ground{position:absolute;left:-5%;right:-5%;bottom:-2%;height:25%;background:linear-gradient(175deg,#d4a62a 0 34%,#8f6518 35% 48%,#304d28 50%);clip-path:polygon(0 40%,13% 27%,29% 47%,45% 25%,61% 44%,78% 23%,100% 41%,100% 100%,0 100%);filter:saturate(1.1)}.figure{position:absolute;left:44%;bottom:12%;width:78px;height:205px;transform-origin:50% 100%;filter:drop-shadow(0 10px 13px #000b);will-change:transform}.head{position:absolute;width:43px;height:43px;left:18px;top:0;border-radius:50%;background:#c67832}.body{position:absolute;left:9px;top:39px;width:60px;height:108px;background:#174b88;clip-path:polygon(29% 0,70% 0,95% 37%,72% 100%,28% 100%,4% 37%)}.arm{position:absolute;top:55px;width:68px;height:15px;background:#174b88;border-radius:20px}.arm.a{left:-41px;transform:rotate(-31deg)}.arm.b{right:-41px;transform:rotate(31deg)}.leg{position:absolute;top:139px;width:19px;height:69px;background:#173e69;border-radius:8px}.leg.a{left:18px;transform:rotate(7deg)}.leg.b{right:18px;transform:rotate(-7deg)}.anchor{position:absolute;width:120px;height:9px;border-radius:50%;background:#ffd24f;box-shadow:0 0 18px #ffd24f;transform:translate(-50%,-50%) rotate(var(--r));pointer-events:none;animation:anchor .75s ease-out forwards}@keyframes anchor{0%{opacity:0;transform:translate(-50%,-50%) scaleX(.2) rotate(var(--r))}25%{opacity:1;transform:translate(-50%,-50%) scaleX(1) rotate(var(--r))}100%{opacity:0;transform:translate(-50%,-180%) scaleX(.35) rotate(var(--r))}}.caption{position:absolute;left:38px;top:34px;font:12px/1.6 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#fffbd3cc}.resist{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);font:12px/1.6 system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#fff7c4;text-align:center;text-shadow:0 2px 12px #000;transition:opacity .5s}.ending{position:absolute;inset:0;display:grid;place-items:center;background:#02040900;opacity:0;pointer-events:none;transition:opacity 1.5s}.ending.on{opacity:1;background:#020409d9}.ending span{font-size:clamp(24px,4vw,54px);letter-spacing:.08em;color:#f1db9b;text-align:center}@media(max-width:700px){.stage{width:82vw}.plaque{bottom:-66px}.hint{bottom:18px}.vortex{width:92vw;left:64%;top:26%}.figure{left:35%;transform:scale(.82)}.caption{left:18px;top:18px;font-size:10px}}
</style>
</head>
<body>
<section id="scene1" class="scene s1">
  <div class="grain"></div>
  <div id="stage" class="stage">
    <div class="frame">
      <div class="painting"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Self-Portrait%20%28Van%20Gogh%20September%201889%29.jpg?width=1200" alt="Van Gogh self portrait" /></div>
      <div class="tear"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Vincent%20van%20Gogh%20Starry%20Night.jpg?width=1280" alt="" /></div>
      <div id="flap" class="flap"></div><div id="rope" class="rope"></div>
    </div>
    <div id="plaque" class="plaque">VINCENT VAN GOGH<div id="dust" class="dust"></div></div>
  </div>
  <div id="hint1" class="hint">move across the name to wake the painting</div><div id="flash" class="portalFlash"></div>
</section>
<section id="scene2" class="scene s2 hidden">
  <div class="sky"></div><div id="vortex" class="vortex"></div><div id="stars" class="stars"></div><div class="ground"></div>
  <div id="figure" class="figure"><i class="head"></i><i class="body"></i><i class="arm a"></i><i class="arm b"></i><i class="leg a"></i><i class="leg b"></i></div>
  <div class="caption">SCENE II · RESIST THE SKY</div><div id="resist" class="resist">click / tap to paint yourself back to earth</div><div id="ending" class="ending"><span>THE SKY WINS.</span></div>
</section>
<script>
const s1=document.getElementById('scene1'),s2=document.getElementById('scene2'),stage=document.getElementById('stage'),plaque=document.getElementById('plaque'),dust=document.getElementById('dust'),hint1=document.getElementById('hint1'),rope=document.getElementById('rope'),flap=document.getElementById('flap'),flash=document.getElementById('flash');
let wipe=0,drag=false,startY=0,pull=0;
plaque.addEventListener('pointermove',e=>{if(wipe>=1)return;wipe=Math.min(1,wipe+.045);dust.style.opacity=1-wipe;if(wipe>.62){wipe=1;s1.classList.add('awake');hint1.textContent='grab the ring · pull down';}});
window.addEventListener('pointermove',e=>{if(!drag){let x=(e.clientX/innerWidth-.5)*5,y=(e.clientY/innerHeight-.5)*4;stage.style.transform=`rotateY(${x}deg) rotateX(${-y}deg)`;return}pull=Math.max(0,Math.min(1,(e.clientY-startY)/250));rope.style.height=(33+pull*25)+'%';let p=pull<.18?pull*.25:.045+(pull-.18)/.82*.955;flap.style.transform=`rotateX(${p*112}deg) translateY(${-p*28}px) translateZ(${p*36}px)`;if(pull>.96)enterPortal();});
rope.addEventListener('pointerdown',e=>{if(!s1.classList.contains('awake'))return;drag=true;startY=e.clientY-pull*250;rope.setPointerCapture?.(e.pointerId);s1.classList.add('dragging');});
window.addEventListener('pointerup',()=>{drag=false;s1.classList.remove('dragging')});
let entered=false;function enterPortal(){if(entered)return;entered=true;drag=false;hint1.style.opacity=0;stage.style.transition='transform 1.25s cubic-bezier(.15,.75,.2,1),filter 1s';stage.style.transform='scale(6) translateY(9%)';stage.style.filter='brightness(1.7) blur(2px)';flash.animate([{opacity:0,background:'radial-gradient(circle at 57% 28%,#fff7c9 0,transparent 0)'},{opacity:1,background:'radial-gradient(circle at 57% 28%,#fff7c9 0,#8cb7ff 20%,transparent 60%)'}],{duration:900,fill:'forwards'});setTimeout(()=>{s1.classList.add('hidden');s2.classList.remove('hidden');startResist();},900)}
const stars=document.getElementById('stars');for(let i=0;i<80;i++){let d=document.createElement('i');d.className='star';d.style.left=Math.random()*100+'%';d.style.top=(55+Math.random()*45)+'%';d.style.setProperty('--x',(100+Math.random()*700)+'px');d.style.setProperty('--y',(-250-Math.random()*650)+'px');d.style.setProperty('--d',(2.8+Math.random()*4)+'s');d.style.animationDelay=(-Math.random()*5)+'s';stars.appendChild(d)}
const figure=document.getElementById('figure'),resist=document.getElementById('resist'),ending=document.getElementById('ending');let y=0,vy=0,t0=0,active=false,last=0;
function startResist(){active=true;t0=performance.now();requestAnimationFrame(loop)}
function loop(t){if(!active)return;let dt=Math.min(.034,(t-last||16)/1000);last=t;let elapsed=(t-t0)/1000;let suction=20+elapsed*7+Math.max(0,elapsed-8)*12;vy+=suction*dt;y+=vy*dt;let floor=Math.max(0,(elapsed-10)*4);if(y<floor){y=floor;vy=Math.max(0,vy)};figure.style.transform=`translateY(${-y}px) rotate(${Math.sin(t/350)*2}deg)`;if(elapsed>5)resist.textContent='keep painting · it is getting stronger';if(elapsed>10)resist.textContent='your marks no longer hold';if(y>innerHeight*.55||elapsed>17){active=false;figure.animate([{opacity:1,transform:figure.style.transform},{opacity:0,transform:`translate(140px,-${innerHeight}px) scale(.3) rotate(40deg)`}],{duration:1200,fill:'forwards',easing:'cubic-bezier(.4,0,.8,1)'});setTimeout(()=>ending.classList.add('on'),700);return}requestAnimationFrame(loop)}
function resistHit(e){if(!active)return;let elapsed=(performance.now()-t0)/1000;let power=Math.max(35,155-elapsed*8.5);vy-=power;y=Math.max(0,y-3);let a=document.createElement('i');a.className='anchor';a.style.left=e.clientX+'px';a.style.top=Math.min(innerHeight-70,e.clientY)+'px';a.style.setProperty('--r',(Math.random()*20-10)+'deg');s2.appendChild(a);setTimeout(()=>a.remove(),800)}
s2.addEventListener('pointerdown',resistHit);
</script>
</body>
</html>
